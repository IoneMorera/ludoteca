services:
  mysql:
    image: mysql:8.0
    container_name: ludoteca-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ludoteca
    ports:
      - "3306:3306"
    volumes:
      - ludoteca-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ludoteca-backend
    working_dir: /app
    expose:
      - "9000"
    volumes:
      - ./backend:/app
      - backend-vendor:/app/vendor
      - backend-bootstrap-cache:/app/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: ludoteca-nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/app
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend-vendor:/app/vendor
    depends_on:
      - backend

volumes:
  ludoteca-mysql-data:
  backend-vendor:
  backend-bootstrap-cache:

server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php;

    client_max_body_size 20M;

    # Frontend Vue.js (ficheros estaticos compilados)
    location / {
        root /srv/frontend;
        try_files $uri $uri/ /index.html;
    }

    # API Laravel
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Sanctum (autenticacion cookies web)
    location /sanctum {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Storage publico de Laravel (imagenes subidas)
    location /storage {
        alias /app/storage/app/public;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # PHP-FPM
    location ~ \.php$ {
        root /app/public;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Cache de assets estaticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2|ttf|eot)$ {
        root /srv/frontend;
        expires 30d;
        access_log off;
        try_files $uri /app/public/$uri =404;
    }

    # No exponer archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

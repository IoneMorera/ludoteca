services:
  mysql:
    image: mysql:8.0
    container_name: ludoteca-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-LudotecaSecure2026!}
      MYSQL_DATABASE: ludoteca
    volumes:
      - ludoteca-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ludoteca-backend
    restart: always
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend-vendor:/app/vendor
      - backend-bootstrap-cache:/app/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.build
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost}
    container_name: ludoteca-frontend
    restart: "no"
    volumes:
      - frontend-dist:/srv/frontend

  nginx:
    image: nginx:alpine
    container_name: ludoteca-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./backend:/app
      - ./backend/docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - backend-vendor:/app/vendor
      - frontend-dist:/srv/frontend:ro
    depends_on:
      - backend
      - frontend

volumes:
  ludoteca-mysql-data:
  backend-vendor:
  backend-bootstrap-cache:
  frontend-dist:
